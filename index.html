<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f7"><title>Личный ежедневник</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Настройки" data-icon="settings"></button>
    <button class="period-title" id="periodCaret" aria-label="Выбрать период"><h1 id="periodTitle"></h1><span data-icon="chevronDown"></span></button>
    <button class="today-btn" id="todayBtn">Сегодня</button>
  </header>
  <div class="period-bar" id="periodBar">
    <button class="icon-btn" id="prevPeriod" aria-label="Предыдущий период" data-icon="chevronLeft"></button>
    <div class="view-switch" id="viewSwitch" aria-label="Вид планера"><button class="view-tab active" id="primaryTab" aria-pressed="true">Месяц</button><button class="view-tab" id="secondaryTab" aria-pressed="false">Фокус</button></div>
    <button class="icon-btn" id="nextPeriod" aria-label="Следующий период" data-icon="chevronRight"></button>
  </div>
  <div class="status hidden" id="status" role="status"></div>
  <div class="content-surface" id="contentSurface">
    <section id="monthPage" aria-label="Календарь месяца"><div class="calendar-weekdays"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div class="calendar-grid" id="calendarGrid"></div></section>
    <section class="hidden" id="weekPage" aria-label="Планер недели"><div class="week-grid" id="weekGrid"></div></section>
    <section class="focus-page hidden" id="focusPage" aria-label="Фокус"></section>
    <section class="hidden" id="habitsPage" aria-label="Привычки"></section>
    <section class="hidden" id="stickersPage" aria-label="Стикеры и списки"></section>
  </div>
</main>
<nav class="bottom-nav" aria-label="Разделы">
  <button class="selected" id="monthNav" aria-current="page"><span data-icon="calendar"></span><span>Месяц</span></button>
  <button id="weekNav"><span data-icon="planner"></span><span>Неделя</span></button>
  <button class="add-main" id="globalAdd" aria-label="Добавить задачу" data-icon="plus"></button>
  <button id="habitsNav"><span data-icon="leaf"></span><span>Привычки</span></button>
  <button id="stickersNav"><span data-icon="note"></span><span>Стикеры</span></button>
</nav>
<div id="dialogs"></div>
<script src="model.js"></script><script src="script.js"></script>
</body></html>
