<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ежедневник — Неделя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="prevWeek" aria-label="Предыдущая неделя">‹</button>
      <div class="week-title">
        <h1 id="weekTitle"></h1>
        <span id="weekNumber"></span>
      </div>
      <button class="icon-btn" id="nextWeek" aria-label="Следующая неделя">›</button>
    </header>

    <div class="view-switch">
      <button class="view-tab active" id="spreadTab">Разворот</button>
      <button class="view-tab" id="focusTab">Фокус</button>
      <button class="more-btn" aria-label="Дополнительно">•••</button>
    </div>

    <section class="week-grid" id="weekGrid" aria-label="Неделя"></section>
  </main>

  <nav class="bottom-nav" aria-label="Основная навигация">
    <button><span class="nav-icon">▣</span><span>Месяц</span></button>
    <button class="selected"><span class="nav-icon">▢</span><span>Неделя</span></button>
    <button class="add-main" id="globalAdd" aria-label="Добавить">＋</button>
    <button><span class="nav-icon">♧</span><span>Привычки</span></button>
    <button><span class="nav-icon">▷</span><span>Блог</span></button>
  </nav>

  <div class="modal hidden" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Новая задача</h2>
        <button class="modal-close" id="closeModal" aria-label="Закрыть">×</button>
      </div>
      <label class="field">
        <span>Задача</span>
        <input id="taskInput" type="text" maxlength="120" autocomplete="off" placeholder="Например, тренировка">
      </label>
      <label class="star-option">
        <input id="priorityInput" type="checkbox">
        <span>★ Сделать главной задачей дня</span>
      </label>
      <div class="modal-actions">
        <button class="delete-btn hidden" id="deleteTask">Удалить</button>
        <button class="save-btn" id="saveTask">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
